spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT (Clave de mínimo 32 caracteres para HS256)
jwt:
  secret: RecetaYaClaveSecretaMuySeguraParaJWT2026!
  expiration-ms: 900000          # access token: 15 minutos
  refresh-expiration-ms: 604800000 # refresh token: 7 días

# Actuator: qué endpoints de operación se publican por HTTP
# (/actuator/health está permitido sin token en SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        include: health, info