spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT (Clave de mínimo 32 caracteres para HS256)
jwt:
  secret: RecetaYaClaveSecretaMuySeguraParaJWT2026!
  expiration-ms: 86400000 # 24 horas